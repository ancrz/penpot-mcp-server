[project]
name = "penpot-mcp"
dynamic = ["version"]
description = "MCP server for self-hosted Penpot — AI-powered UI/UX design and prototyping"
readme = {text = "", content-type = "text/plain"}
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.30.0,<2",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "redis>=5.2.0",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
penpot-mcp = "penpot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/penpot_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/penpot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not integration' --ignore=tests/test_e2e_login_form.py"
markers = [
    "integration: tests requiring live Penpot instance",
    "e2e: end-to-end Playwright browser tests against live stack",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
