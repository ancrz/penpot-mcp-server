# ═══════════════════════════════════════════════════════════
# Penpot MCP Server — Docker Compose Service Definition
# ═══════════════════════════════════════════════════════════
#
# This is NOT a standalone docker-compose file.
# Copy this service definition into your existing Penpot
# docker-compose.yml, inside the `services:` section.
#
# Security Prerequisite (Least-Privilege PostgreSQL Role):
#   Create a dedicated read-only `penpot_mcp` role in `penpot-postgres`:
#     CREATE ROLE penpot_mcp LOGIN PASSWORD 'change-me' NOSUPERUSER NOCREATEDB NOCREATEROLE;
#     ALTER ROLE penpot_mcp SET default_transaction_read_only = on;
#     ALTER ROLE penpot_mcp SET statement_timeout = '30s';
#     GRANT USAGE ON SCHEMA public TO penpot_mcp;
#     GRANT SELECT ON comment, comment_thread, file, file_change, file_library_rel,
#         file_media_object, presence, project, share_link, team, team_font_variant,
#         team_profile_rel TO penpot_mcp;
#     GRANT SELECT (id, fullname, email) ON profile TO penpot_mcp;
#     GRANT SELECT (id, team_id, created_at, updated_at, uri, mtype, error_code,
#         error_count, is_active) ON webhook TO penpot_mcp;
#
# After adding, run:
#   docker compose up -d --build penpot-mcp
# ═══════════════════════════════════════════════════════════

services:
  penpot-mcp:
    image: "penpot-mcp:${PENPOT_MCP_VERSION:-0.4.0}"
    build:
      context: ./penpot-mcp-server
      dockerfile: Dockerfile
      args:
        PENPOT_MCP_VERSION: "${PENPOT_MCP_VERSION:-0.4.0}"
        PYTHON_IMAGE_TAG: "${PYTHON_IMAGE_TAG:-3.13-alpine}"
        UV_VERSION: "${UV_VERSION:-0.12.10}"
    container_name: penpot-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:4402:4402"
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-backend:
        condition: service_started
    networks:
      - penpot
    environment:
      PENPOT_MCP_VERSION: "${PENPOT_MCP_VERSION:-0.4.0}"
      MCP_PROTOCOL_VERSION: "${MCP_PROTOCOL_VERSION:-2025-03-26}"
      MCP_TOOL_MODE: "${MCP_TOOL_MODE:-compressed}"
      PENPOT_BASE_URL: "http://penpot-frontend:8080"
      PENPOT_PUBLIC_URL: "${PENPOT_PUBLIC_URI:-http://localhost:9001}"
      SSRF_ALLOW_PRIVATE_MEDIA: "${SSRF_ALLOW_PRIVATE_MEDIA:-false}"
      PENPOT_ACCESS_TOKEN: "${PENPOT_ACCESS_TOKEN:-}"
      PENPOT_EMAIL: "${PENPOT_EMAIL:-}"
      PENPOT_PASSWORD: "${PENPOT_PASSWORD:-}"
      PENPOT_DB_HOST: "penpot-postgres"
      PENPOT_DB_PORT: "5432"
      PENPOT_DB_NAME: "penpot"
      PENPOT_DB_USER: "${PENPOT_DB_USER:-penpot}"
      PENPOT_DB_PASS: "${PENPOT_DB_PASS:-}"
      DB_STATEMENT_TIMEOUT_MS: "30000"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8787"
      MCP_LOG_LEVEL: "info"
      MCP_ALLOWED_HOSTS: '["127.0.0.1","localhost","penpot-mcp","host.docker.internal"]'
      WS_ENABLED: "${WS_ENABLED:-false}"
      WS_HOST: "${WS_HOST:-127.0.0.1}"
      WS_PORT: "4402"
      WS_TOKEN: "${WS_TOKEN:-}"
      PLUGIN_WS_URL: "ws://localhost:4402"
      PLUGIN_ORIGIN: "http://localhost:8787"
      PENPOT_AGENT_MODE: "${PENPOT_AGENT_MODE:-auto}"
      PENPOT_AGENT_MODEL: "${PENPOT_AGENT_MODEL:-gemini-3.5-flash-lite}"
      PENPOT_AGENT_FALLBACK_MODEL: "${PENPOT_AGENT_FALLBACK_MODEL:-gemini-2.5-flash}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GOOGLE_API_KEY_BACKUP: "${GOOGLE_API_KEY_BACKUP:-}"
      GOOGLE_GEMINI_BASE_URL: "${GOOGLE_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://localhost:11434/v1}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:e2b}"
      PENPOT_AGENT_RPM: "${PENPOT_AGENT_RPM:-15}"
      PENPOT_AGENT_MAX_TURNS: "${PENPOT_AGENT_MAX_TURNS:-6}"
