# Valkey 8.1 application baseline for Penpot PubSub (DB 0) + MCP Read-Through Cache (DB 1)
# Adapted from edilio-vivas baseline.
# Secrets do not belong in this file.

# Network
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0
protected-mode no

# Memory / eviction: volatile-lfu (NOT allkeys-lfu).
# Epoch invalidation counters (cache:namespace:*:epoch) have no TTL;
# volatile-lfu structurally protects TTL-less epoch counters from eviction
# while evicting cached query payloads under memory pressure.
maxmemory 256mb
maxmemory-policy volatile-lfu
maxmemory-samples 5
maxmemory-clients 0

# Persistence: disabled (cache is strictly reconstructible from PostgreSQL).
save ""
appendonly no
appendfsync everysec
dir /data

# Lazy free (non-blocking eviction & expiration)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# Logging / databases (DB 0 = Penpot, DB 1 = penpot-mcp cache)
loglevel notice
databases 16
io-threads 2
