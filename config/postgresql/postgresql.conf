# PostgreSQL 15/16/17 + pgvector application baseline for Penpot + MCP
# Adapted from edilio-vivas baseline for Penpot self-hosted + pgvector HNSW.
# Secrets and host-specific credentials do not belong in this file.

# External config keeps cluster-owned paths explicit.
data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
listen_addresses = '*'
port = 5432

# Memory (sized for a 1-2GB container cgroup ceiling without OOM-kill)
max_connections = 100
shared_buffers = 512MB
work_mem = 8MB
maintenance_work_mem = 128MB
effective_cache_size = 1536MB
huge_pages = try
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2

# WAL & Checkpoints
checkpoint_timeout = 5min
max_wal_size = 1GB
min_wal_size = 80MB

# Autovacuum (keeps pgvector HNSW and Penpot tables clean)
track_counts = on
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
autovacuum_work_mem = -1
log_autovacuum_min_duration = 10min

# Planner I/O (SSD-optimized; avoids sequential scan bias on HNSW/B-tree)
random_page_cost = 1.1
effective_io_concurrency = 200
