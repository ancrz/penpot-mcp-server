# Penpot AI Studio Gateway — Nginx Unprivileged (adapted from edilio-vivas)
# Routes:
#   / and /plugin/ui.html -> React 19 + Zod SPA (static)
#   /assets/              -> Immutable hashed Vite assets
#   /plugin/ws & /ws      -> Go 1.24 WebSocket Hub (penpot-ws-go:4402)
#   /agent/, /mcp, /plugin/* -> Python 3.14 FastMCP + AI Gateway (penpot-mcp:8787)

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self' http://localhost:9001 http://127.0.0.1:9001 http://host.docker.internal:9001;" always;

    # SPA Shell (no-store so new builds take effect immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /plugin/ui.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # Immutable hashed Vite assets
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Go WebSocket Hub (imperative Go concurrency for all WS connections)
    location /plugin/ws {
        proxy_pass http://penpot-ws-go:4402/plugin/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /ws/ {
        proxy_pass http://penpot-ws-go:4402/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Python 3.14 FastMCP + AI Gateway + Plugin Manifest/Embed
    location /agent/ {
        proxy_pass http://penpot-mcp:8787/agent/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /mcp {
        proxy_pass http://penpot-mcp:8787/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /plugin/ {
        proxy_pass http://penpot-mcp:8787/plugin/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
